  <rect x="35" y="33" width="24" height="4.5" rx="2.25" fill="#c7d9fb" />
  <rect x="35" y="43" width="24" height="4.5" rx="2.25" fill="#c7d9fb" />
  <rect x="35" y="53" width="16" height="4.5" rx="2.25" fill="#c7d9fb" />

  <!-- Huy hiệu "đã xác nhận bởi AI" -->
