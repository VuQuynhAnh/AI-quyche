<!-- Hoạ tiết lặp lại (tile) làm nền mờ cho khung chat — như "hình nền" của các
     app nhắn tin. Mỗi ô 96x96 chứa 1 bản logo thu nhỏ, độ mờ rất thấp (đã
     "nướng" sẵn bằng fill-opacity vì CSS "opacity" không áp dụng riêng cho
     từng lớp background-image). Lặp lại (background-repeat: repeat) nên hoạ
     tiết luôn hiện ra ở khoảng trống giữa các bong bóng chat, bất kể có bao
     nhiêu tin nhắn hay đang cuộn tới đâu. -->
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(18, 16) scale(0.6)">
    <rect x="4" y="4" width="92" height="92" rx="24" fill="#1d4ed8" fill-opacity="0.028" />
    <rect x="27" y="21" width="40" height="52" rx="6" fill="#1d4ed8" fill-opacity="0.05" />
    <rect x="35" y="33" width="24" height="4.5" rx="2.25" fill="#1d4ed8" fill-opacity="0.035" />
    <rect x="35" y="43" width="24" height="4.5" rx="2.25" fill="#1d4ed8" fill-opacity="0.035" />
    <rect x="35" y="53" width="16" height="4.5" rx="2.25" fill="#1d4ed8" fill-opacity="0.035" />
    <circle cx="70" cy="70" r="17" fill="none" stroke="#1d4ed8" stroke-opacity="0.05" stroke-width="3.5" />
    <path d="M62.5 70.5 L67.5 75.5 L78 63.5" fill="none" stroke="#1d4ed8" stroke-opacity="0.05" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
